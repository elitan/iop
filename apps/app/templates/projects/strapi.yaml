name: Strapi
description: Headless CMS with admin panel
category: cms
docs: https://docs.strapi.io/

services:
  strapi:
    image: strapi/strapi:5.8.1
    port: 1337
    main: true
    icon: strapi
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: ${postgres.HOST}
      DATABASE_PORT: ${postgres.PORT}
      DATABASE_NAME: ${postgres.DATABASE}
      DATABASE_USERNAME: ${postgres.USERNAME}
      DATABASE_PASSWORD: ${postgres.PASSWORD}
      APP_KEYS:
        generated: base64_32
      API_TOKEN_SALT:
        generated: base64_32
      ADMIN_JWT_SECRET:
        generated: base64_32
      TRANSFER_TOKEN_SALT:
        generated: base64_32
      JWT_SECRET:
        generated: base64_32
    volumes:
      - data:/opt/app
    health_check:
      path: /_health
      timeout: 120

  postgres:
    image: postgres:16-alpine
    port: 5432
    type: database
    environment:
      POSTGRES_PASSWORD:
        generated: password
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
    volumes:
      - data:/var/lib/postgresql/data
